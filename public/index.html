<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Community Space</title>
    <meta name="description" content="">
    <meta name="theme-color" content="#060811">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:type" content="website">
    <meta property="og:image" content="">
    <link data-favicon rel="icon" href="">
    <link rel="stylesheet" href="styles/main.css">
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-copy="skipLink">Skip to content</a>
    <div class="ambient" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div data-header-sentinel></div>

    <header class="site-header" data-collapsed="false">
      <a class="brand" href="#hero" data-brand-link aria-label="">
        <img data-logo alt="" width="64" height="64">
        <span data-site-name></span>
      </a>
      <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="site-nav">
        <span class="menu-toggle__bar"></span>
        <span class="visually-hidden" data-copy="menuToggle">Open navigation</span>
      </button>
      <nav id="site-nav" class="site-nav" data-nav data-open="false" aria-label="Main navigation"></nav>
    </header>

    <main id="main">
      <section id="hero" class="hero" data-hero-image>
        <div class="hero__content" data-reveal>
          <p class="hero__signal" data-hero-signal></p>
          <h2 data-hero-title></h2>
          <div class="hero__video" data-hero-video-wrapper hidden></div>
          <p data-hero-body></p>
          <div class="hero__actions" data-hero-actions></div>
        </div>
        <div class="hero__panel" data-reveal>
          <span data-hero-panel-label></span>
          <strong data-hero-panel-text></strong>
        </div>
      </section>

      <section id="about" class="section section--split">
        <div class="section__intro" data-reveal>
          <span class="section__number" data-about-number></span>
          <h2 data-about-title></h2>
        </div>
        <div class="copy-stack" data-reveal>
          <div data-about-copy></div>
          <div class="belief-strip" data-about-tags></div>
        </div>
      </section>

      <section id="events" class="section">
        <div class="section__heading" data-reveal>
          <span class="section__number" data-events-number></span>
          <h2 data-events-title></h2>
          <p data-events-description></p>
        </div>
        <div class="event-grid" data-upcoming-events></div>
        <p class="empty-state" data-events-empty hidden></p>
      </section>

      <section id="archive" class="section section--archive">
        <div class="section__heading section__heading--compact" data-reveal>
          <h2 data-events-archive-title></h2>
          <p data-events-archive-description></p>
        </div>
        <div class="archive-slider" data-archive-slider data-reveal>
          <div class="archive-slider__controls" aria-label="Archive navigation">
            <button class="archive-slider__button" type="button" data-archive-prev aria-label="Show newer events">
              <span aria-hidden="true">←</span>
            </button>
            <button class="archive-slider__button" type="button" data-archive-next aria-label="Show older events">
              <span aria-hidden="true">→</span>
            </button>
          </div>
          <div class="archive-slider__viewport" data-archive-viewport>
            <div class="archive-slider__track" data-past-events></div>
          </div>
        </div>
      </section>

      <section id="culture" class="section culture">
        <div class="section__heading" data-reveal>
          <span class="section__number" data-culture-number></span>
          <h2 data-culture-title></h2>
          <p data-culture-description></p>
        </div>
        <div class="culture-grid" data-culture-cards></div>
      </section>

      <section id="gallery" class="section mood">
        <div class="section__heading" data-reveal>
          <span class="section__number" data-gallery-number></span>
          <h2 data-gallery-title></h2>
          <p data-gallery-description></p>
        </div>
        <div class="mood-grid" data-gallery></div>
      </section>

      <section id="instagram" class="section section--split instagram">
        <div class="section__intro" data-reveal>
          <span class="section__number" data-instagram-number></span>
          <h2 data-instagram-title></h2>
          <p class="muted" data-instagram-description></p>
          <a class="button" data-instagram-link target="_blank" rel="noreferrer" href=""></a>
        </div>
        <div class="instagram-frame" data-reveal>
          <div class="instagram-frame__header">
            <span data-instagram-username></span>
            <span data-instagram-source></span>
          </div>
          <div data-instagram-embed></div>
        </div>
      </section>

      <section id="membership" class="section membership">
        <div class="membership__content" data-reveal>
          <h2 data-membership-title></h2>
          <p data-membership-description></p>
          <div class="membership__actions">
            <a class="button" data-membership-link href=""></a>
            <a class="text-link" data-membership-secondary href=""></a>
          </div>
        </div>
      </section>

      <section id="contact" class="section contact">
        <div class="section__heading" data-reveal>
          <span class="section__number" data-contact-number></span>
          <h2 data-contact-title></h2>
          <p data-contact-description></p>
        </div>
        <div class="contact-grid" data-contact-cards></div>
        <div class="map-card" data-reveal>
          <div class="map-card__copy">
            <span data-map-label></span>
            <h3 data-map-title></h3>
            <p data-map-description></p>
            <a class="text-link" data-maps-link href="" target="_blank" rel="noreferrer" data-map-button></a>
          </div>
          <iframe
            data-maps-embed
            title=""
            src=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </section>
    </main>

    <footer id="footer" class="site-footer">
      <p data-footer-copyright></p>
      <a class="footer-credit" href="https://github.com/SMNFL" target="_blank" rel="noopener noreferrer" aria-label="Coded by SMNFL on GitHub">
        <span>coded by</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 0.5C5.65 0.5 0.5 5.65 0.5 12c0 5.09 3.29 9.39 7.86 10.91 0.58 0.1 0.79-0.25 0.79-0.56v-2c-3.2 0.69-3.88-1.38-3.88-1.38-0.52-1.32-1.27-1.67-1.27-1.67-1.04-0.71 0.08-0.7 0.08-0.7 1.15 0.08 1.75 1.18 1.75 1.18 1.02 1.75 2.68 1.25 3.33 0.95 0.1-0.74 0.4-1.25 0.73-1.54-2.55-0.29-5.23-1.28-5.23-5.68 0-1.26 0.45-2.28 1.18-3.08-0.12-0.29-0.51-1.46 0.11-3.04 0 0 0.96-0.31 3.16 1.18 0.92-0.25 1.9-0.38 2.88-0.39 0.98 0.01 1.96 0.14 2.88 0.39 2.19-1.49 3.15-1.18 3.15-1.18 0.63 1.58 0.23 2.75 0.12 3.04 0.74 0.8 1.18 1.82 1.18 3.08 0 4.41-2.69 5.38-5.25 5.67 0.41 0.36 0.78 1.06 0.78 2.14v3.03c0 0.31 0.21 0.67 0.8 0.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35 0.5 12 0.5Z"/>
        </svg>
      </a>
      <nav data-footer-links aria-label="Rechtliches"></nav>
    </footer>
  </body>
</html>
