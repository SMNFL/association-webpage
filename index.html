<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050712;
      color: #f5f7fb;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(61, 247, 223, 0.18), transparent 28rem),
        radial-gradient(circle at 80% 20%, rgba(255, 79, 216, 0.16), transparent 30rem),
        #050712;
    }

    .banner {
      max-width: 560px;
      margin: 1rem;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 1.25rem;
      background: rgba(16, 20, 39, 0.78);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      text-align: center;
      backdrop-filter: blur(20px);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1;
    }

    p {
      margin: 0 0 1.5rem;
      color: #aeb7c8;
      line-height: 1.6;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 1.25rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #d5ff5f, #3df7df);
      color: #071015;
      font-weight: 900;
      text-decoration: none;
    }

    a:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="banner">
    <h1>Website Preview</h1>
    <a href="./public/">Open website</a>
  </main>
</body>
</html>
